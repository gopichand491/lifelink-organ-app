name: Selenium E2E Tests + Deploy Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  selenium-test:
    name: Selenium E2E Login Test
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      # Step 3 — Install Chrome (latest stable)
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      # Step 4 — Install dashboard dependencies
      - name: Install dashboard dependencies
        run: npm install
        working-directory: dashboard

      # Step 5 — Install Selenium + Mocha
      - name: Install Selenium dependencies
        run: npm install selenium-webdriver mocha --save-dev
        working-directory: dashboard

      # Step 6 — Install backend dependencies
      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      # Step 7 — Start backend server in background
      - name: Start backend server
        run: npm run dev &
        working-directory: backend
        env:
          PORT: 4000
          NODE_ENV: development
          CORS_ORIGIN: '*'
          JWT_SECRET: test-secret-for-ci

      # Step 8 — Start dashboard dev server in background
      - name: Start dashboard dev server
        run: npm run dev &
        working-directory: dashboard
        env:
          CI: true

      # Step 9 — Wait for servers to be ready
      - name: Wait for servers to be ready
        run: |
          echo "Waiting for backend (port 4000)..."
          timeout 30 bash -c 'until curl -s http://localhost:4000/api/health; do sleep 2; done'
          echo "Waiting for dashboard (port 5173)..."
          timeout 30 bash -c 'until curl -s http://localhost:5173; do sleep 2; done'
          echo "Both servers are ready!"

      # Step 10 — Run Selenium E2E login test
      - name: Run Selenium Login Test
        run: npx mocha selenium-tests/tests/login.test.js --timeout 30000
        working-directory: dashboard
        env:
          CI: true
          TEST_URL: http://localhost:5173

      # Step 11 — Report result
      - name: Test Summary
        if: always()
        run: echo "Selenium E2E tests completed. See logs above for pass/fail details."

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: selenium-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: dashboard

      - name: Install gh-pages
        run: npm install gh-pages --save-dev
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard

      - name: Deploy to GitHub Pages
        run: npm run deploy
        working-directory: dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
