name: E2E Tests + Excel Report + Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  selenium-tests:
    name: "Selenium E2E Web + API + Security Tests (400 Tests)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd dashboard/selenium-tests
          npm install

      - name: Run Selenium Tests (400 Web Tests)
        env:
          SELENIUM_DRY_RUN: 'true'
        run: |
          cd dashboard/selenium-tests
          npm test || true

      - name: Upload Selenium Test Results
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: dashboard/selenium-results.json

  appium-tests:
    name: "Appium Mobile Tests Dry-Run (400 Tests)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openpyxl

      - name: Run Appium Pytest Suite (400 Mobile Tests)
        env:
          APPIUM_DRY_RUN: 'true'
        run: |
          pytest appium-tests/ --tb=short || true

      - name: Upload Appium Test Results
        uses: actions/upload-artifact@v4
        with:
          name: appium-results
          path: appium-tests/appium-results.json

  generate-report:
    name: "Generate LifeLink_Test_Report.xlsx (800 Total Tests)"
    needs: [selenium-tests, appium-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Download Selenium Results
        uses: actions/download-artifact@v4
        with:
          name: selenium-results
          path: dashboard/
        continue-on-error: true

      - name: Download Appium Results
        uses: actions/download-artifact@v4
        with:
          name: appium-results
          path: appium-tests/
        continue-on-error: true

      - name: Generate Excel Report
        run: |
          python generate_report.py

      - name: Upload Master Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: LifeLink_Test_Report
          path: LifeLink_Test_Report.xlsx

  deploy:
    name: "Deploy to GitHub Pages"
    needs: [generate-report]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies & Build
        run: |
          cd dashboard
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dashboard/dist
